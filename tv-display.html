<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>K-OS · WOD TV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      color: #fff;
      font-family: 'Big Shoulders Display', 'Arial Black', Arial, sans-serif;
      overflow: hidden;
    }

    /* ════════════════════════════════
       PANTALLA EDITOR
    ════════════════════════════════ */
    #screen-editor {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 1.6rem; padding: 2rem;
      z-index: 1;
      background:
        radial-gradient(ellipse at 20% 15%, rgba(0,165,178,0.10), transparent 55%),
        radial-gradient(ellipse at 80% 90%, rgba(0,165,178,0.08), transparent 50%),
        #fafafa;
    }
    #brand-logo {
      height: clamp(90px, 15vh, 160px); width: auto;
    }
    #screen-editor p {
      font-size: 1.15rem; color: #555;
      font-family: Arial, sans-serif; text-align: center;
      max-width: 700px; line-height: 1.5;
    }
    #wod-input {
      width: min(64vw, 860px); aspect-ratio: 16 / 9;
      background: #1a1a1a; color: #f0f0f0;
      border: 2px solid #2a2a2a; border-radius: 8px;
      font-size: 1.2rem; font-family: 'Courier New', monospace;
      line-height: 1.6; padding: 1.2rem; resize: vertical;
      outline: none; transition: border-color 0.2s;
    }
    #wod-input:focus { border-color: #555; }
    #wod-input::placeholder { color: #333; }
    .editor-btns { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }
    button {
      padding: 1.1rem 2.4rem; font-size: 1.15rem; font-weight: 700;
      font-family: 'Arial Black', Arial, sans-serif;
      text-transform: uppercase; letter-spacing: 0.04em;
      cursor: pointer; border: none; border-radius: 6px;
      background: #111; color: #fff;
      transition: transform 0.1s, filter 0.15s;
    }
    button:hover  { filter: brightness(1.3); }
    button:active { transform: scale(0.97); }

    /* Móvil: logo más grande relativo a la pantalla, botones compactos */
    @media (max-width: 600px) {
      #brand-logo { height: 120px; }
      #screen-editor p { font-size: 0.95rem; max-width: 88vw; }
      #wod-input { width: 88vw; }
      .editor-btns { flex-direction: column; width: 88vw; gap: 0.6rem; }
      button { font-size: 0.85rem; padding: 0.8rem 1rem; width: 100%; letter-spacing: 0.01em; }
      #btn-back {
        opacity: 1; color: #fff; background: rgba(255,255,255,0.28);
        font-size: 1.2rem; padding: 0.75rem 1.5rem; bottom: 1.2rem; right: 1.2rem;
        border-radius: 8px; font-weight: 700;
      }
      #display-hint { display: none; } /* "Esc volver" no aplica en móvil */
    }

    /* ════════════════════════════════
       PANTALLA DISPLAY
    ════════════════════════════════ */
    #screen-display {
      position: fixed; inset: 0;
      display: none; align-items: center; justify-content: center;
      background: #050a0b; overflow: hidden;
      z-index: 2;
    }

    /* ── Fondo turquesa K-OS ── */
    #display-bg {
      position: absolute; inset: 0; z-index: 0; overflow: hidden;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 12% 18%, rgba(0,165,178,0.38), transparent 55%),
        radial-gradient(ellipse at 88% 85%, rgba(0,165,178,0.28), transparent 50%),
        linear-gradient(135deg, #001b1e 0%, #050a0b 55%, #00262a 100%);
    }



    /* ── Esquina inferior derecha: logo + reloj ── */
    #display-corner {
      position: fixed; bottom: 1.5rem; right: 1.8rem;
      display: flex; flex-direction: column; align-items: center;
      gap: 0.6rem; z-index: 10; pointer-events: none;
    }
    #display-logo {
      height: clamp(55px, 8vh, 110px); width: auto;
      opacity: 0.95;
    }
    #wod-clock {
      background: rgba(0, 20, 23, 0.5);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(0, 165, 178, 0.55);
      border-radius: 8px; padding: 0.2rem 0.7rem;
      font-family: 'Orbitron', 'Courier New', monospace;
      font-size: clamp(0.85rem, 1.5vw, 1.9rem);
      font-weight: 700; color: #fff;
      letter-spacing: 0.1em;
    }

    /* Marco con la proporción real de un TV (16:9), centrado y
       "letterboxed" dentro de la pantalla disponible — así en un
       móvil en vertical se ve una previsualización fiel a escala de
       cómo quedaría en la TV, sin necesidad de girar el teléfono. */
    #tv-frame {
      width:  min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      display: flex; flex-direction: column;
      padding: 1.5vh 0 clamp(35px, 4vh, 52px);
      position: relative; overflow: hidden; z-index: 1;
    }

    /* Cabecera fija — tamaños en vw, no escala con el scaler */
    #wod-header {
      flex-shrink: 0;
      text-align: center;
      padding-bottom: 0.5vh;
    }
    #wod-header .title {
      font-size: clamp(20px, 4.5vw, 90px);
      font-weight: 900; color: #fff;
      text-transform: uppercase; letter-spacing: 0.02em; line-height: 1.1;
    }
    #wod-header .subtitle {
      font-size: clamp(14px, 2.7vw, 54px);
      font-weight: 400; color: rgba(255,255,255,0.6); line-height: 1.15;
      letter-spacing: 0.06em; text-transform: uppercase;
    }

    /* Wrapper del grid — ocupa el espacio restante (flex:1) */
    #wod-content {
      flex: 1;
      min-height: 0;
      width: 100%;
      overflow: hidden;
      position: relative;
    }

    /* Grid de secciones — SIN flex:1 para que scrollHeight refleje el tamaño real */
    #wod-grid {
      display: grid;
      width: 100%;
      gap: 4px 0;   /* sin hueco entre columnas: franja continua */
      text-transform: uppercase;
      /* height y alignContent los controla el scaler */
    }

    /* Tarjeta de sección */
    .wod-card {
      padding: 0.08em 0;
      min-width: 0;  /* evita que la columna se expanda con texto nowrap */
      min-height: 0; /* evita que la fila se expanda con el contenido */
      overflow: hidden;
      display: flex; flex-direction: column; justify-content: flex-start;
    }
    .card-num {
      font-size: 0.85em; font-weight: 400;
      color: rgba(255,255,255,0.35);
      line-height: 1.1; margin-bottom: 0.08em;
      letter-spacing: 0.05em;
      white-space: normal;
    }
    /* Franja de color bajo el título de cada bloque (como en la pizarra de K-OS) */
    .card-title {
      font-size: 1.4em; font-weight: 900;
      color: #fff;
      line-height: 1.05; margin-bottom: 0.3em;
      letter-spacing: 0.03em;
      white-space: normal;
      background: #00a5b2;
      padding: 0.1em 0.35em 0.06em;
    }
    /* Margen interior de las tarjetas (las franjas van de borde a borde) */
    .wod-card > :not(.card-title) { padding-left: 0.5em; padding-right: 0.5em; }
    .wod-card.col-first > *       { padding-left: 2vw; }
    .wod-card.col-last  > *       { padding-right: 2vw; }
    .wod-line {
      font-size: 1em; font-weight: 500;
      color: #fff; line-height: 1.35;
      letter-spacing: 0.03em;
      white-space: normal;
    }
    .wod-note {
      font-size: 0.88em; font-style: italic;
      color: rgba(255,255,255,0.45); line-height: 1.15;
      white-space: normal;
    }
    strong { color: #fff; font-weight: 900; }
    #wod-grid strong { font-size: 1.1em; font-weight: 900; }

    /* Botón volver */
    #btn-back {
      position: fixed; bottom: 0.5rem; right: 0.7rem;
      background: rgba(255,255,255,0.06); color: #444;
      font-size: 0.65rem; padding: 0.25rem 0.6rem;
      border-radius: 3px; opacity: 0.3; transition: opacity 0.2s;
      text-transform: none; letter-spacing: 0;
      font-family: Arial, sans-serif; font-weight: 400; z-index: 20;
    }
    #btn-back:hover { opacity: 1; color: #ccc; }

    #btn-fs-display {
      position: fixed; top: 1rem; right: 1rem;
      background: rgba(255,255,255,0.18); color: #fff;
      font-size: 1.1rem; padding: 0.6rem 1.2rem;
      border-radius: 8px; font-weight: 700;
      font-family: Arial, sans-serif; z-index: 20;
      text-transform: none; letter-spacing: 0;
    }
    #btn-fs-display:hover { background: rgba(255,255,255,0.32); }

    @media (max-width: 600px) {
      #btn-back {
        opacity: 1; color: #fff; font-weight: 700;
        font-size: 1.2rem; padding: 0.75rem 1.5rem;
        bottom: 1.2rem; right: 1.2rem;
        background: rgba(255,255,255,0.22); border-radius: 8px;
        width: auto;
      }
    }

    #display-hint {
      display: none !important;
      position: fixed; bottom: 0.5rem; left: 0.7rem;
      color: #1c1c1c; font-size: 0.6rem;
      font-family: Arial, sans-serif; pointer-events: none;
    }

    /* ════ Botones secundarios del editor ════ */
    #btn-share { display: none; } /* solo visible en HTTP */

    /* ════ Modal Chromecast ════ */
    #cast-modal {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,0.88);
      display: none; align-items: center; justify-content: center;
    }
    #cast-panel {
      background: #111; border: 1px solid #2a2a2a;
      border-radius: 10px; padding: 2rem 2.2rem 1.6rem;
      max-width: 400px; width: 92%; text-align: center;
    }
    .cast-title {
      font-size: 0.95rem; font-weight: 900; color: #fff;
      text-transform: uppercase; letter-spacing: 0.08em;
      margin-bottom: 1.4rem;
    }
    .cast-steps { text-align: left; margin-bottom: 1.4rem; }
    .cast-step {
      display: flex; gap: 0.8rem; align-items: flex-start;
      margin-bottom: 0.9rem;
    }
    .cast-n {
      background: #fff; color: #000; border-radius: 50%;
      min-width: 1.35rem; height: 1.35rem;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.65rem; font-weight: 900; flex-shrink: 0;
      margin-top: 0.1rem;
    }
    .cast-text {
      font-size: 0.82rem; color: #999;
      font-family: Arial, sans-serif; line-height: 1.55;
    }
    .cast-text strong { color: #fff; font-family: 'Arial Black', Arial, sans-serif; }
    .cast-text code {
      background: #1e1e1e; border: 1px solid #333;
      border-radius: 3px; padding: 0.05em 0.35em;
      font-family: monospace; font-size: 0.9em; color: #ccc;
    }
    .cast-note {
      font-size: 0.72rem; color: #666; font-family: Arial, sans-serif;
      line-height: 1.5; text-align: left; margin-bottom: 1.4rem;
      border-top: 1px solid #2a2a2a; padding-top: 0.9rem;
    }
    .cast-share-box {
      background: rgba(255,255,255,0.07); border-radius: 10px;
      padding: 1rem 1rem 0.8rem; margin-bottom: 1.2rem; text-align: center;
    }
    .cast-share-label {
      font-size: 0.7rem; color: #888; font-family: Arial, sans-serif;
      letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 0.7rem;
    }
    .cast-share-sub {
      font-size: 0.7rem; color: #666; font-family: Arial, sans-serif;
      line-height: 1.45; margin-top: 0.6rem;
    }
    #btn-share-wod {
      width: 100%; background: #fff; color: #000;
      font-size: 0.95rem; padding: 0.65rem 1rem;
      border-radius: 8px; border: none; cursor: pointer;
      font-weight: 900; letter-spacing: 0.02em;
      font-family: 'Arial Black', Arial, sans-serif;
    }
    #btn-cast-close {
      background: #1a1a1a; color: #666; border: 1px solid #2a2a2a;
      font-size: 0.8rem; padding: 0.55rem 1.4rem;
    }
    #btn-cast-close:hover { color: #ccc; }

    /* ════ Pantalla de espera TV ════ */
    #screen-tv-wait {
      display: none; position: fixed; inset: 0;
      background: #000; flex-direction: column;
      align-items: center; justify-content: center; z-index: 5; gap: 1.2rem;
    }
    #tv-logo { height: 170px; opacity: 0.92; }
    #tv-qr { width: 230px; height: 230px; border-radius: 6px; }
    #tv-wait-label {
      color: #888; font-family: 'Arial Black', Arial, sans-serif;
      font-size: 0.95rem; letter-spacing: 0.15em; text-transform: uppercase;
    }
    #tv-wait-sub {
      color: #2a2a2a; font-family: Arial, sans-serif;
      font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase;
    }
    #tv-wait-btns { display: flex; gap: 0.6rem; margin-top: 0.6rem; }
    #btn-tv-fs, #btn-tv-renew {
      background: #1a1a1a; color: #555;
      border: 1px solid #2a2a2a; border-radius: 8px;
      font-size: 0.9rem; padding: 0.6rem 1.4rem; cursor: pointer;
      font-family: Arial, sans-serif;
    }
    #btn-tv-fs:hover, #btn-tv-renew:hover { color: #ccc; border-color: #555; }

    /* ════ Pantalla enviar WOD (móvil tras escanear) ════ */
    #screen-send {
      display: none; position: fixed; inset: 0;
      background: #111; flex-direction: column;
      align-items: center; padding: 2rem 1.5rem; box-sizing: border-box; z-index: 10;
    }
    #send-logo { height: 90px; margin-bottom: 1.2rem; }
    #send-input {
      width: 100%; flex: 1; background: #1a1a1a; color: #fff;
      border: 1px solid #333; border-radius: 10px; padding: 1rem;
      font-size: 1rem; resize: none; margin-bottom: 1rem;
      font-family: Arial, sans-serif; box-sizing: border-box;
    }
    #btn-send-wod {
      width: 100%; background: #fff; color: #000;
      font-size: 1.1rem; font-weight: 900; padding: 1rem;
      border: none; border-radius: 10px; cursor: pointer;
      font-family: 'Arial Black', Arial, sans-serif; letter-spacing: 0.04em;
    }
    #send-status {
      margin-top: 0.8rem; color: #666; font-family: Arial, sans-serif;
      font-size: 0.85rem; text-align: center; min-height: 1.2em;
    }
    #send-status.error { color: #ff6b6b; font-size: 0.95rem; }
    #btn-scan {
      align-self: flex-start; margin-bottom: 0.6rem;
      background: transparent; color: #00a5b2; border: 1px solid rgba(0,165,178,0.5);
      border-radius: 8px; padding: 0.55rem 0.9rem; font-size: 0.85rem;
      font-family: Arial, sans-serif; font-weight: 700; text-transform: none; letter-spacing: 0;
    }
    #btn-scan.big {
      align-self: stretch; background: #00a5b2; color: #fff; border: none;
      font-size: 1.05rem; padding: 1rem; margin: 0.8rem 0 0;
      order: 10;  /* abajo, donde estaba "Enviar" */
    }

    /* ════ Escáner QR (móvil) ════ */
    #scan-overlay {
      display: none; position: fixed; inset: 0; z-index: 40;
      background: #000; flex-direction: column;
      align-items: center; justify-content: center; gap: 1rem; padding: 1.5rem;
    }
    #scan-video {
      width: 100%; max-width: 480px; aspect-ratio: 1; object-fit: cover;
      border-radius: 14px; border: 3px solid #00a5b2; background: #111;
    }
    #scan-msg {
      color: #ccc; font-family: Arial, sans-serif; font-size: 0.95rem;
      text-align: center; max-width: 480px;
    }
    #btn-scan-cancel {
      background: #1a1a1a; color: #fff; border: 1px solid #333;
      border-radius: 10px; font-size: 0.95rem; padding: 0.8rem 2rem;
    }

    /* ════ TV: botón "Volver al QR" ════
       Aparece al mover el ratón, tocar o pulsar una tecla, y se
       oculta solo a los 5 s para no tapar el WOD. */
    body.tv #btn-back {
      top: auto; bottom: 1.5rem; left: 1.8rem; right: auto; width: auto;
      background: rgba(0, 20, 23, 0.75); color: #fff;
      border: 1px solid rgba(0, 165, 178, 0.7); border-radius: 10px;
      font-family: Arial, sans-serif; font-weight: 700;
      font-size: clamp(1rem, 1.8vw, 1.8rem); padding: 0.7em 1.3em;
      opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    body.tv.show-controls #btn-back { opacity: 1; pointer-events: auto; }
    body.tv.fs #btn-back { display: none; }
    body.tv #display-hint { display: none; }

  </style>
</head>

    /* ─── Canal TV en tiempo real ───
       Cada TV genera su propio código (guardado en el navegador) y lo mete
       en el QR: solo puede enviar WODs quien ha escaneado esa TV. */
    const NTFY_BASE = 'https://ntfy.sh/kos-wod-';
    let channel  = null;   // código del canal activo (TV o móvil)
    let tvMode   = false;
    let tvSource = null;
    // Mensaje que la TV deja en su canal antiguo al generar un QR nuevo,
    // para que los móviles conectados sepan que ya no sirve.
    const REVOKED = '__kos_qr_revocado__';

    function newCode() {
      const bytes = crypto.getRandomValues(new Uint8Array(9));
      return Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
    }

    function getTVCode(renew) {
      let code = null;
      try { if (!renew) code = localStorage.getItem('kos-tv-code'); } catch (e) {}
      if (!code) {
        code = newCode();
        try { localStorage.setItem('kos-tv-code', code); } catch (e) {}
      }
      return code;
    }

    function sendToTV(raw) {
      if (!channel) return Promise.reject(new Error('sin canal'));
      return fetch(NTFY_BASE + channel, { method: 'POST', body: raw })
        .then(r => { if (!r.ok) throw new Error(r.status); });
    }

    function startTVMode(renew) {
      tvMode  = true;
      document.body.classList.add('tv');
      document.getElementById('btn-back').textContent = '← Volver al QR';
      channel = getTVCode(renew);
      history.replaceState(null, '', location.pathname);
      document.getElementById('tv-logo').src = LOGO_LIGHT;
      const sendURL = location.origin + location.pathname + '#send=' + channel;
      document.getElementById('tv-qr').src =
        'https://api.qrserver.com/v1/create-qr-code/?size=260x260&color=ffffff&bgcolor=000000&data=' +
        encodeURIComponent(sendURL);
      document.getElementById('screen-editor').style.display = 'none';
      document.getElementById('screen-display').style.display = 'none';
      document.getElementById('screen-tv-wait').style.display = 'flex';
      // Recupera el último WOD enviado hoy (ntfy guarda los mensajes ~12 h),
      // así un reinicio de la TV no obliga a reenviarlo.
      const midnight = Math.floor(new Date().setHours(0, 0, 0, 0) / 1000);
      if (tvSource) tvSource.close();
      tvSource = new EventSource(NTFY_BASE + channel + '/sse?since=' + midnight);
      tvSource.addEventListener('message', e => {
        try {
          const m = JSON.parse(e.data).message;
          if (m && m !== REVOKED) showTVWOD(m);
        } catch (err) {}
      });
    }

    function startSendMode(code) {
      channel = code || null;
      document.getElementById('send-logo').src = LOGO_LIGHT;
      document.getElementById('screen-editor').style.display = 'none';
      document.getElementById('screen-send').style.display = 'flex';
      const btn = document.getElementById('btn-send-wod');
      const status = document.getElementById('send-status');
      if (!channel) {
        btn.style.display = 'none';
        status.textContent = 'Escanea el QR que aparece en la TV.';
        const scan = document.getElementById('btn-scan');
        scan.classList.add('big');
        scan.textContent = '📷 Escanear QR';
        return;
      }
      // Escucha el canal por si la TV genera un QR nuevo (ntfy guarda ~12 h)
      const es = new EventSource(NTFY_BASE + channel + '/sse?since=12h');
      es.addEventListener('message', e => {
        try { if (JSON.parse(e.data).message === REVOKED) { es.close(); markRevoked(); } } catch (err) {}
      });
      btn.addEventListener('click', () => {
        const raw = document.getElementById('send-input').value;
        if (!raw.trim()) return;
        btn.disabled = true;
        status.textContent = 'Enviando…';
        sendToTV(raw).then(() => {
          btn.textContent = '✓ WOD enviado';
          btn.style.background = '#4caf50'; btn.style.color = '#fff';
          status.textContent = 'El WOD ya está en la TV.';
        }).catch(() => {
          status.textContent = 'No se pudo enviar. Revisa la conexión e inténtalo de nuevo.';
        }).finally(() => { btn.disabled = false; });
      });
    }

    function markRevoked() {
      channel = null;
      document.getElementById('btn-send-wod').style.display = 'none';
      const status = document.getElementById('send-status');
      status.classList.add('error');
      status.textContent = 'Este QR ya no es válido: en la TV se ha generado uno nuevo.';
      const scan = document.getElementById('btn-scan');
      scan.classList.add('big');
      scan.textContent = '📷 Escanear el QR nuevo';
    }

    // Si se edita el texto tras enviar, el botón vuelve a "Enviar"
    function resetSendButton() {
      if (!channel) return;
      const btn = document.getElementById('btn-send-wod');
      btn.textContent = '📺 Enviar al TV';
      btn.style.background = ''; btn.style.color = '';
      document.getElementById('send-status').textContent = '';
    }

    /* ─── Escáner QR en el móvil ───
       Para cambiar de TV o cuando la TV genera un QR nuevo. */
    const JSQR_URL = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
    const JSQR_SRI = 'sha384-b5Ya4Bq3qCyz39m2ISh+4DxjAIljdeFwK/BsXLuj9gugaNwAcj/ia15fxNZL9Nlx';
    let scanStream = null;

    function loadJsQR() {
      if (window.jsQR) return Promise.resolve();
      return new Promise((ok, fail) => {
        const s = document.createElement('script');
        s.src = JSQR_URL; s.integrity = JSQR_SRI; s.crossOrigin = 'anonymous';
        s.onload = ok; s.onerror = fail;
        document.head.appendChild(s);
      });
    }

    async function openScanner() {
      const msg   = document.getElementById('scan-msg');
      const video = document.getElementById('scan-video');
      document.getElementById('scan-overlay').style.display = 'flex';
      msg.textContent = 'Apunta al QR de la TV';
      try {
        await loadJsQR();
        scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      } catch (e) {
        msg.textContent = 'No se pudo abrir la cámara. Escanea el QR con la app de cámara del móvil.';
        return;
      }
      video.srcObject = scanStream;
      await video.play().catch(() => {});
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      const tick = () => {
        if (!scanStream) return;
        if (video.readyState >= 2 && video.videoWidth) {
          canvas.width = video.videoWidth; canvas.height = video.videoHeight;
          ctx.drawImage(video, 0, 0);
          const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const qr = jsQR(img.data, img.width, img.height);  // el QR de la TV es blanco sobre negro: jsQR prueba ambos
          const m = qr && qr.data.match(/#send=([0-9a-f]+)/);
          if (m) {
            closeScanner();
            location.replace(location.pathname + '#send=' + m[1]);
            location.reload();
            return;
          }
          if (qr) msg.textContent = 'Ese QR no es de una TV K-OS.';
        }
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    }

    function closeScanner() {
      if (scanStream) scanStream.getTracks().forEach(t => t.stop());
      scanStream = null;
      document.getElementById('scan-video').srcObject = null;
      document.getElementById('scan-overlay').style.display = 'none';
    }

    /* ─── TV: mostrar "Volver al QR" con cualquier interacción ─── */
    let ctrlTimer;
    function showTVControls() {
      if (!tvMode) return;
      document.body.classList.add('show-controls');
      clearTimeout(ctrlTimer);
      ctrlTimer = setTimeout(() => document.body.classList.remove('show-controls'), 5000);
    }

    function showTVWOD(raw) {
      document.getElementById('screen-tv-wait').style.display = 'none';
      renderWOD(raw);
      document.getElementById('display-logo').src = LOGO_LIGHT;
      document.getElementById('screen-display').style.display = 'flex';
      startClock();
      setTimeout(scaleWOD, 100);
    }

    /* ─── Codificación WOD en URL ─── */
    function encodeWOD(text) {
      return btoa(unescape(encodeURIComponent(text)));
    }
    function decodeWOD(b64) {
      try { return decodeURIComponent(escape(atob(b64))); } catch(e) { return null; }
    }
    function wodURL(raw) {
      return location.origin + location.pathname + '#wod=' + encodeWOD(raw);
    }

    /* ─── Utilidades ─── */
    function esc(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // Convierte texto con marcadores **bold** en HTML con <strong>
    // Sin marcadores: bold automático en números. Con marcadores: procesa secciones.
    function applyBold(text) {
      if (!text.includes('**')) {
        return esc(text).replace(/\b(\d+(?:[.,]\d+)?)\b/g, '<strong>$1</strong>');
      }
      const parts = text.split(/(\*\*[^*\n]+\*\*)/);
      return parts.map(p => {
        if (p.startsWith('**') && p.endsWith('**')) {
          return `<strong>${esc(p.slice(2, -2))}</strong>`;
        }
        return esc(p).replace(/\b(\d+(?:[.,]\d+)?)\b/g, '<strong>$1</strong>');
      }).join('');
    }

    function renderLine(line) {
      const t = line.trim();
      if (!t) return '';
      return `<div class="wod-line">${applyBold(t)}</div>`;
    }

    /* ─── Leer negritas del portapapeles ─── */
    function htmlToText(html) {
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const buf = [];

      function isBold(node) {
        const tag = node.tagName.toLowerCase();
        if (tag === 'b' || tag === 'strong') return true;
        const fw = (node.getAttribute('style') || '').match(/font-weight\s*:\s*(\w+)/);
        if (fw) return fw[1] === 'bold' || parseInt(fw[1]) >= 700;
        return false;
      }

      function walk(node, bold) {
        if (node.nodeType === 3) {
          const t = node.textContent;
          if (!t) return;
          // Nodo de texto: si está en negrita y tiene contenido real, añadir marcadores **
          buf.push((bold && t.trim()) ? `**${t.trim()}**` : t);
          return;
        }
        if (node.nodeType !== 1) return;
        const tag = node.tagName.toLowerCase();
        if (tag === 'script' || tag === 'style') return;
        if (tag === 'br') { buf.push('\n'); return; }

        const b = bold || isBold(node);
        for (const child of node.childNodes) walk(child, b);

        // Siempre añadir salto de línea tras elemento de bloque —
        // incluyendo divs vacíos que actúan de separador de sección
        if (['p','div','li','h1','h2','h3','h4','h5','h6','tr'].includes(tag)) {
          buf.push('\n');
        }
      }

      walk(doc.body, false);

      return buf.join('')
        .replace(/\*\*\s*\*\*/g, '')     // marcadores vacíos
        .replace(/[ \t]{2,}/g, ' ')      // espacios múltiples
        .replace(/\n{3,}/g, '\n\n')      // máximo una línea en blanco
        .trim();
    }

    /* ─── Detección de bloques ─── */
    // Regla única: línea en blanco = nueva columna
    // Títulos de sección habituales: abren bloque nuevo aunque no haya
    // línea en blanco antes (y una línea en blanco justo después no lo cierra).
    const SECTION_RE = new RegExp('^(' + [
      'WOD', 'METCON', 'STRENGTH', 'FUERZA', 'WARM[ -]?UP', 'CALENTAMIENTO',
      'SKILLS?', 'T[ÉE]CNICA', 'ACCESSORY', 'ACCESSORIES', 'ACCESORIOS?',
      'CORE', 'CASH[ -]?OUT', 'BUY[ -]?IN', 'GYMNASTICS', 'GIMN[ÁA]STICA',
      'WEIGHTLIFTING', 'HALTEROFILIA', 'FINISHER', 'EXTRA', 'MOBILITY',
      'MOVILIDAD', 'CONDITIONING', 'ENGINE', 'BENCHMARK',
      '(?:PARTNER|TEAM|HERO|OPEN) WOD', 'PARTE? [A-Z0-9]'
    ].join('|') + ')( ?\\d+)?\\s*:?$', 'i');

    function splitBlocks(raw) {
      const blocks = [];
      let cur = [];
      for (const ln of raw.split(/\r?\n/)) {
        const t = ln.trim();
        if (!t) {
          const onlyTitle = cur.length === 1 && SECTION_RE.test(cur[0]);
          if (cur.length && !onlyTitle) { blocks.push(cur); cur = []; }
        } else if (SECTION_RE.test(t)) {
          if (cur.length) blocks.push(cur);
          cur = [t.replace(/\s*:$/, '')];
        } else {
          cur.push(t);
        }
      }
      if (cur.length) blocks.push(cur);
      return blocks.length ? blocks : [[]];
    }

    /* ─── Número de columnas según secciones ───
       1 → 1 col
       2 → 2 col
       3 → 3 col
       4 → 2 col × 2 filas  (2×2, toda la pantalla)
       5-6 → 3 col × 2 filas
       7+ → 3 col
    ─── */
    function getColCount(n) {
      if (n <= 3) return n;
      if (n === 4) return 2;
      return 3;
    }

    /* ─── Render de tarjeta ─── */
    function renderCard(block) {
      const first = block[0] || '';
      const isNum = /^\d+[\)\.]\s*/.test(first);
      const body  = block.slice(1).map(renderLine).join('');

      if (isNum) {
        return `<div class="wod-card"><div class="card-num">${esc(first)}</div>${body}</div>`;
      } else {
        return `<div class="wod-card"><div class="card-title">${applyBold(first)}</div>${body}</div>`;
      }
    }

    /* ─── Parseo y render ─── */
    function renderWOD(raw) {
      if (!raw.trim()) return;
      let blocks = splitBlocks(raw);

      document.getElementById('wod-header').innerHTML = '';

      const grid = document.getElementById('wod-grid');
      const cols = getColCount(blocks.length);
      const rows = Math.ceil(blocks.length / cols);
      // Filas y columnas con tamaño fijo (1fr) — cada tarjeta ocupa
      // siempre toda su celda, sin importar cuánto contenido tenga.
      grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
      grid.style.gridTemplateRows    = `repeat(${rows}, 1fr)`;
      grid.innerHTML = blocks.map(b => renderCard(b)).join('');
      grid.querySelectorAll('.wod-card').forEach((card, i) => {
        if (i % cols === 0)        card.classList.add('col-first');
        if (i % cols === cols - 1) card.classList.add('col-last');
      });
    }

    /* ─── Auto-escalado ───
       Todas las tarjetas usan el mismo tamaño de letra: el mayor que
       permite que quepa la más cargada. Solo las líneas sueltas que no
       caben a lo ancho se encogen individualmente.
    ─── */

    // Encoge líneas que no caben en ancho de su tarjeta (una sola línea).
    // Devuelve true si se encogió alguna.
    // Ancho que ocupa la línea en una sola fila (texto + su margen interior)
    function naturalWidth(el) {
      el.style.width = 'max-content'; el.style.whiteSpace = 'nowrap';
      const w = el.scrollWidth;
      el.style.width = ''; el.style.whiteSpace = '';
      return w;
    }

    function refineLongLines(cards) {
      let shrunken = false;
      Array.from(cards).forEach(card => {
        const cardW = card.clientWidth;
        card.querySelectorAll('.wod-line, .card-title').forEach(line => {
          line.style.fontSize = '';         // hereda de la tarjeta
          if (naturalWidth(line) <= cardW) return;

          // getComputedStyle captura el tamaño real (incluyendo 1.4em de card-title)
          const hi0 = parseFloat(getComputedStyle(line).fontSize) || 16;
          let lo = 6, hi = hi0;
          while (hi - lo > 0.5) {
            const mid = (lo + hi) / 2;
            line.style.fontSize = mid + 'px';
            if (naturalWidth(line) <= cardW) lo = mid; else hi = mid;
          }
          line.style.fontSize = Math.floor(lo) + 'px';
          shrunken = true;
        });
      });
      return shrunken;
    }

    function scaleWOD() {
      const content = document.getElementById('wod-content');
      const grid    = document.getElementById('wod-grid');
      const display = document.getElementById('screen-display');

      if (display.style.display === 'none') return;

      const maxH = content.clientHeight;
      const maxW = content.clientWidth;
      if (maxH < 50 || maxW < 100) { setTimeout(scaleWOD, 100); return; }

      grid.style.height = maxH + 'px';
      grid.style.fontSize = '';

      grid.querySelectorAll('.wod-card').forEach(c => c.style.fontSize = '');
      grid.querySelectorAll('.wod-line, .card-title').forEach(el => {
        el.style.fontSize = ''; el.style.lineHeight = '';
      });

      const cards = Array.from(grid.querySelectorAll('.wod-card'));
      if (!cards.length) return;

      const fits = () => !cards.some(c =>
        c.scrollHeight > c.clientHeight + 1 || c.scrollWidth > c.clientWidth + 1);
      const search = () => {
        let lo = 4, hi = 500;
        while (hi - lo > 1) {
          const mid = (lo + hi) >> 1;
          cards.forEach(c => c.style.fontSize = mid + 'px');
          if (fits()) lo = mid; else hi = mid;
        }
        cards.forEach(c => c.style.fontSize = lo + 'px');
        return lo;
      };

      let size = search();
      if (refineLongLines(cards)) size = search();

      // Títulos: mismo tamaño en todos y franja de la misma altura aunque
      // alguno haya que encogerlo para que quepa.
      const targetTitlePx = Math.round(size * 1.4);
      cards.forEach(card => {
        const title = card.querySelector('.card-title');
        if (!title) return;
        title.style.lineHeight = Math.round(targetTitlePx * 1.05) + 'px';
        title.style.fontSize   = targetTitlePx + 'px';
        if (naturalWidth(title) > card.clientWidth) {
          // No cabe en una línea: bajar hasta que quepa
          let lo = 6, hi = targetTitlePx;
          while (hi - lo > 0.5) {
            const mid = (lo + hi) / 2;
            title.style.fontSize = mid + 'px';
            if (naturalWidth(title) <= card.clientWidth) lo = mid; else hi = mid;
          }
          title.style.fontSize = Math.floor(lo) + 'px';
        }
      });
    }

    /* ─── Control de pantallas ─── */

    // Al entrar en pantalla completa en móvil, forzamos horizontal si el
    // navegador lo permite (Android/Chrome). Esto es clave al castear/
    // reflejar la pantalla a una TV real: si el teléfono se queda en
    // vertical, la TV recibe una imagen vertical y la "pillarboxea"
    // (barras negras a los lados) en vez de aprovechar toda la pantalla.
    // En iOS no existe esta API, así que ahí se queda con el preview
    // "letterboxed" en proporción 16:9 (#tv-frame) como mejor alternativa.
    /* ── Reloj en tiempo real (zona horaria España) ── */
    let _clockInterval = null;
    const _clockFmt = new Intl.DateTimeFormat('es-ES', {
      timeZone: 'Europe/Madrid',
      hour: '2-digit', minute: '2-digit',
      hour12: false
    });
    function startClock() {
      const el = document.getElementById('clock-display');
      function tick() { el.textContent = _clockFmt.format(new Date()); }
      tick();
      _clockInterval = setInterval(tick, 1000);
    }
    function stopClock() {
      clearInterval(_clockInterval); _clockInterval = null;
      document.getElementById('clock-display').textContent = '--:--';
    }

    function tryLockLandscape() {
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(() => {});
      }
    }

    function showDisplay() {
      const raw = document.getElementById('wod-input').value;
      if (!raw.trim()) return;

      sendToTV(raw).catch(() => {});
      history.replaceState(null, '', '#wod=' + encodeWOD(raw));
      renderWOD(raw);
      document.getElementById('display-logo').src = LOGO_LIGHT;
      document.getElementById('screen-editor').style.display = 'none';
      document.getElementById('screen-display').style.display = 'flex';
      startClock();

      // Escalar después de que el layout esté listo
      setTimeout(scaleWOD, 100);

      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen()
          .then(() => { tryLockLandscape(); setTimeout(scaleWOD, 200); })
          .catch(() => {});
      } else {
        tryLockLandscape();
      }
    }

    function goBack() {
      stopClock();
      document.getElementById('screen-display').style.display = 'none';
      if (tvMode) {
        history.replaceState(null, '', location.pathname);
        document.getElementById('screen-tv-wait').style.display = 'flex';
      } else {
        history.replaceState(null, '', '#editor');
        document.getElementById('screen-editor').style.display  = 'flex';
      }
      if (document.fullscreenElement) document.exitFullscreen();
      if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen()
          .then(() => { tryLockLandscape(); setTimeout(scaleWOD, 200); })
          .catch(() => {});
      } else {
        document.exitFullscreen();
      }
    }

    /* ─── Compartir URL (solo en HTTP) ─── */
    if (location.protocol === 'http:' || location.protocol === 'https:') {
      const btnShare = document.getElementById('btn-share');
      btnShare.style.display = '';
      btnShare.addEventListener('click', () => {
        navigator.clipboard.writeText(location.href).then(() => {
          const orig = btnShare.textContent;
          btnShare.textContent = '✓ Copiado';
          setTimeout(() => { btnShare.textContent = orig; }, 2000);
        });
      });
    }

    /* ─── Chromecast ─── */
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    const isStandalone = window.navigator.standalone === true;

    function castStep(n, html) {
      return '<div class="cast-step"><div class="cast-n">' + n + '</div><div class="cast-text">' + html + '</div></div>';
    }

    function buildCastInstructions() {
      const stepsEl = document.getElementById('cast-steps');
      const noteEl  = document.getElementById('cast-note');

      const shareBox = `
        <div class="cast-share-box">
          <div class="cast-share-label">Enviar WOD a la Samsung TV</div>
          <button id="btn-share-wod" onclick="shareWODLink()">📤 Compartir enlace del WOD</button>
          <div class="cast-share-sub">Mándatelo por WhatsApp → ábrelo en la Samsung TV desde WhatsApp Web → el WOD aparece solo en la TV, el móvil queda libre</div>
        </div>`;

      if (isIOS) {
        stepsEl.innerHTML = shareBox +
          castStep(1, '<strong>AirPlay (alternativa)</strong>: gira el móvil a horizontal → Centro de Control → "Duplicar pantalla" → elige tu Samsung TV. El móvil debe quedarse en la app.') +
          castStep(2, '<strong>Cable HDMI</strong>: adaptador Lightning o USB-C a HDMI.');
        noteEl.innerHTML = '';
      } else {
        stepsEl.innerHTML = shareBox +
          castStep(1, 'Desliza desde arriba para abrir los <strong>ajustes rápidos</strong> del móvil') +
          castStep(2, 'Toca <strong>"Transmitir pantalla" / "Smart View"</strong> (el nombre varía según el móvil)') +
          castStep(3, 'Elige tu <strong>Chromecast / TV</strong> en la lista') +
          castStep(4, 'No toques el menú de Chrome durante la transmisión — así el móvil se queda en pantalla completa y horizontal');
        noteEl.innerHTML = '¿No tienes esa opción? Usa el menú ⋮ de Chrome → "Transmitir…", pero ten en cuenta que el navegador puede salir de pantalla completa y mostrar una barra blanca arriba mientras dure la transmisión.';
      }
    }

    function openCastModal() {
      buildCastInstructions();
      document.getElementById('cast-modal').style.display = 'flex';
    }
    function closeCastModal() {
      document.getElementById('cast-modal').style.display = 'none';
    }

    function startCast() {
      // 1. Mostrar el WOD en display
      showDisplay();

      // 2. Intentar Presentation API (abre el diálogo nativo de Chrome si está disponible)
      //    Funciona en HTTP/HTTPS; en file:// puede abrir la UI de transmitir pestaña
      if (window.PresentationRequest) {
        const req = new PresentationRequest([window.location.href]);
        req.start().catch(() => {}); // error silencioso = usuario canceló o no disponible
      }

      // 3. Mostrar las instrucciones paso a paso
      setTimeout(openCastModal, 350);
    }

    /* ─── Eventos ─── */
    document.getElementById('btn-show').addEventListener('click', showDisplay);
    document.getElementById('btn-tv-mode').addEventListener('click', () => startTVMode());
    document.getElementById('btn-tv-renew').addEventListener('click', () => {
      if (confirm('¿Generar un QR nuevo? Los móviles que escanearon el anterior dejarán de poder enviar.')) {
        fetch(NTFY_BASE + channel, { method: 'POST', body: REVOKED }).catch(() => {});
        startTVMode(true);
      }
    });
    document.getElementById('send-input').addEventListener('input', resetSendButton);
    document.getElementById('btn-scan').addEventListener('click', openScanner);
    document.getElementById('btn-scan-cancel').addEventListener('click', closeScanner);
    ['mousemove', 'touchstart', 'keydown'].forEach(ev =>
      document.addEventListener(ev, showTVControls, { passive: true }));
    document.getElementById('btn-cast').addEventListener('click', startCast);
    document.getElementById('btn-cast-close').addEventListener('click', closeCastModal);
    document.getElementById('cast-modal').addEventListener('click', e => {
      if (e.target === e.currentTarget) closeCastModal();
    });

    // Interceptar paste para preservar negritas del portapapeles
    document.getElementById('wod-input').addEventListener('paste', function(e) {
      const html = e.clipboardData.getData('text/html');
      if (!html) return; // sin HTML → paste normal de texto plano
      e.preventDefault();
      const text = htmlToText(html);
      const ta = this;
      const s = ta.selectionStart, end = ta.selectionEnd;
      ta.value = ta.value.slice(0, s) + text + ta.value.slice(end);
      ta.selectionStart = ta.selectionEnd = s + text.length;
    });
    document.getElementById('btn-back').addEventListener('click', goBack);
    document.getElementById('btn-fs').addEventListener('click', toggleFullscreen);

    document.addEventListener('keydown', e => {
      const onDisplay = document.getElementById('screen-display').style.display !== 'none';
      if (!onDisplay) return;
      if (e.key === 'f' || e.key === 'F') toggleFullscreen();
      else if (e.key === 'c' || e.key === 'C') openCastModal();
      else if (e.key === 'Backspace' && tvMode) goBack();
      else if (e.key === 'Escape') {
        if (document.getElementById('cast-modal').style.display !== 'none') closeCastModal();
        else if (!document.fullscreenElement) goBack();
      }
    });

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement && screen.orientation && screen.orientation.unlock) {
        screen.orientation.unlock();
      }
      const inFS = !!document.fullscreenElement;
      document.body.classList.toggle('fs', inFS);
      const fsDisplay = document.getElementById('btn-fs-display');
      const fsTv = document.getElementById('btn-tv-fs');
      if (fsDisplay) fsDisplay.style.display = inFS ? 'none' : '';
      if (fsTv) fsTv.style.display = inFS ? 'none' : '';
      setTimeout(scaleWOD, 200);
    });

    function shareWODLink() {
      const raw = document.getElementById('wod-input').value;
      if (!raw.trim()) return;
      const url = wodURL(raw);
      if (navigator.share) {
        navigator.share({ url, title: 'WOD del día' }).catch(() => {});
      } else {
        navigator.clipboard.writeText(url).then(() => {
          const btn = document.getElementById('btn-share-wod');
          if (!btn) return;
          const orig = btn.textContent;
          btn.textContent = '✓ Enlace copiado';
          setTimeout(() => { btn.textContent = orig; }, 2500);
        }).catch(() => {});
      }
    }

    /* ─── Arranque según URL hash ───
       (sin hash)   → TV: QR + WOD del día
       #send=CÓDIGO → móvil que ha escaneado el QR
       #editor      → editor completo (previsualizar, Chromecast…)
       #wod=…       → enlace compartido con un WOD */
    (function() {
      const h = location.hash;
      if (h.startsWith('#send')) {
        startSendMode(h.slice(6));
      } else if (h === '#editor') {
        document.getElementById('screen-editor').style.display = 'flex';
      } else if (h.startsWith('#wod=')) {
        const wod = decodeWOD(h.slice(5));
        if (wod) {
          document.getElementById('wod-input').value = wod;
          setTimeout(showDisplay, 80);
        } else {
          document.getElementById('screen-editor').style.display = 'flex';
        }
      } else {
        startTVMode();
      }
    })();

    let rsTimer;
    window.addEventListener('resize', () => {
      clearTimeout(rsTimer);
      rsTimer = setTimeout(scaleWOD, 150);
    });
    window.addEventListener('orientationchange', () => setTimeout(scaleWOD, 150));
  </script>
</body>
